schema_version: 1

context:
  name: torch-tb-profiler
  version: "0.4.3"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/torch_tb_profiler-${{ version }}.tar.gz
  sha256: 8b8d29b2de960b3c4423087b23cec29beaf9ac3a8c7b046c18fd25b218f726b1

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - pandas >=1.0.0
    - python >=${{ python_min }}
    - tensorboard >=1.15,!=2.1.0

tests:
  - script:
      - pip check
      - python -c "import torch_tb_profiler"
      - python run_test.py
    files:
      recipe:
        - run_test.py
    requirements:
      run:
        - pip
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/pytorch/kineto/tree/main/tb_plugin
  repository: https://github.com/pytorch/kineto
  summary: TensorBoard plugin that provides visualization of PyTorch profiling
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jeongseok-meta
